[build-system]
requires = [
  "scikit-build-core>=0.9.0",
  "numpy",
  "meson"
]
build-backend = "scikit_build_core.build"

[project]
name = "lowtran"
version = "3.1.0"
description = " Model of Earth atmosphere absorption and transmission vs. wavelength and location."
keywords = ["mesosphere", "stratosphere", "thermosphere", "atmosphere"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Intended Audience :: Science/Research",
  "Programming Language :: Fortran",
  "Topic :: Scientific/Engineering :: Atmospheric Science"
]
requires-python = ">=3.9"
dependencies = ["numpy", "xarray", "python-dateutil"]

[project.optional-dependencies]
tests = ["pytest"]
lint = ["flake8", "flake8-bugbear", "flake8-builtins", "flake8-blind-except", "mypy", "types-python-dateutil"]

[project.readme]
file = "README.md"
content-type = "text/markdown"

[tool.black]
line-length = 100

[tool.mypy]
files = ["src", "example"]
allow_redefinition = true
ignore_missing_imports = true

# scikit-build-core configuration: out-of-source build and package discovery
[tool.scikit-build]
cmake.args = ["-GNinja"]
editable.mode = "redirect"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/lowtran"]
sdist.include = ["src/lowtran", "README.md", "LICENSE.txt", "MANIFEST.in"]
